{% extends 'base.html' %}{% block title %}Produk{% endblock %}{% block content %}<div class="row"><h1>Produk</h1><a class="button" href="{{ url_for('product_new') }}">Tambah Produk</a></div>{% if products %}<table><thead><tr><th>ID</th><th>Nama</th><th>Harga</th><th>Stok</th></tr></thead><tbody>{% for p in products %}<tr><td>{{p.id}}</td><td>{{p.name}}</td><td>Rp{{ '{:,.0f}'.format(p.price) }}</td><td>{{p.stock}}</td></tr>{% endfor %}</tbody></table>{% else %}<p class="empty">Belum ada produk.</p>{% endif %}{% endblock %}
