<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Praktikum Flask Pertemuan 09">
  <title>{% block title %}Praktikum Flask{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{ url_for('home') }}">Flask Lab P09</a>
      <nav aria-label="Navigasi utama">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('product_list') }}">Produk</a>
        <a href="{{ url_for('product_new') }}">Tambah</a>
        <a href="{{ url_for('about') }}">About</a>
      </nav>
    </div>
  </header>

  <main class="container" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="container site-footer">
    <p>Praktikum Algoritma dan Pemrograman — Pertemuan 09</p>
  </footer>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
