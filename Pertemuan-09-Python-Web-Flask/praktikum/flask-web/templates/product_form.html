{% extends 'base.html' %}{% block title %}Tambah Produk{% endblock %}{% block content %}<h1>Tambah Produk</h1><form method="post" novalidate><label>Nama<input name="name" value="{{ request.form.get('name','') }}">{% if errors.name %}<small class="error">{{errors.name}}</small>{% endif %}</label><label>Harga<input name="price" type="number" step="0.01" value="{{ request.form.get('price','') }}">{% if errors.price %}<small class="error">{{errors.price}}</small>{% endif %}</label><label>Stok<input name="stock" type="number" value="{{ request.form.get('stock','') }}">{% if errors.stock %}<small class="error">{{errors.stock}}</small>{% endif %}</label><button type="submit">Simpan</button></form>{% endblock %}
