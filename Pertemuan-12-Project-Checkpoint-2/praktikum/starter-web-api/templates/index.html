<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Checkpoint 2</title></head><body><h1>Dashboard</h1><ul>{% for x in items %}<li>{{x.name}} — {{x.status}}</li>{% endfor %}</ul><button id="b">Ambil Mock API</button><pre id="o"></pre><script>document.querySelector('#b').onclick=async()=>{o.textContent='Loading...';try{let r=await fetch('/api/mock-external');if(!r.ok)throw Error(r.status);o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent='Error: '+e.message}}</script></body></html>
